apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-dedicated-serviceaccount
  annotations:
    policies.kyverno.io/title: Require dedicated ServiceAccount
    policies.kyverno.io/category: Identity
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Pods must run under a dedicated ServiceAccount, never 'default'.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
  - name: check-dedicated-sa
    match:
      any:
      - resources:
          kinds: [Pod]
          namespaceSelector:
            matchLabels:
              tenancy.io/tenant: "true"
    validate:
      message: "Pods must set spec.serviceAccountName to a dedicated account (not empty, not 'default')."
      cel:
        expressions:
        - expression: >
            !has(object.spec) || (
              has(object.spec.serviceAccountName)
              && object.spec.serviceAccountName != ""
              && object.spec.serviceAccountName != "default"
            )
