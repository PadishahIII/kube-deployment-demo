apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-default-proc-mount
  annotations:
    policies.kyverno.io/title: Require default /proc mount
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Containers must not use procMount=Unmasked.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
  - name: check-proc-mount
    match:
      any:
      - resources:
          kinds: [Pod]
          namespaceSelector:
            matchLabels:
              tenancy.io/tenant: "true"
    validate:
      message: "Containers must not set securityContext.procMount=Unmasked (default masking required)."
      cel:
        expressions:
        - expression: >
            !has(object.spec) || (
              object.spec.containers.all(c,
                !has(c.securityContext)
                || !has(c.securityContext.procMount)
                || c.securityContext.procMount != "Unmasked")
            )
