apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-host-namespaces
  annotations:
    policies.kyverno.io/title: Disallow host namespaces
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Pods must not share host network/PID/IPC namespaces.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
  - name: check-no-host-ns
    match:
      any:
      - resources:
          kinds: [Pod]
          namespaceSelector:
            matchLabels:
              tenancy.io/tenant: "true"
    validate:
      message: "Pods must not set hostNetwork, hostPID, or hostIPC to true."
      cel:
        expressions:
        - expression: >
            !has(object.spec) || (
              (!has(object.spec.hostNetwork) || object.spec.hostNetwork == false)
              && (!has(object.spec.hostPID) || object.spec.hostPID == false)
              && (!has(object.spec.hostIPC) || object.spec.hostIPC == false)
            )
