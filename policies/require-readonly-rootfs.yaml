apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-readonly-rootfs
  annotations:
    policies.kyverno.io/title: Require read-only root filesystem
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Every container must set readOnlyRootFilesystem=true.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
  - name: check-readonly-rootfs
    match:
      any:
      - resources:
          kinds: [Pod]
          namespaceSelector:
            matchLabels:
              tenancy.io/tenant: "true"
    validate:
      message: "Every container must set securityContext.readOnlyRootFilesystem=true."
      cel:
        expressions:
        - expression: >
            !has(object.spec) || (
              object.spec.containers.all(c,
                has(c.securityContext)
                && has(c.securityContext.readOnlyRootFilesystem)
                && c.securityContext.readOnlyRootFilesystem == true)
            )
