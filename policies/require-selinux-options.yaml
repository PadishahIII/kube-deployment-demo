apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-selinux-options
  annotations:
    policies.kyverno.io/title: Require SELinux options
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Every container must set a securityContext.seLinuxOptions.level.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
  - name: check-selinux-level
    match:
      any:
      - resources:
          kinds: [Pod]
          namespaceSelector:
            matchLabels:
              tenancy.io/tenant: "true"
    validate:
      message: "Every container must set securityContext.seLinuxOptions.level (spec-level conformance; runtime enforcement needs an SELinux-enabled node)."
      cel:
        expressions:
        - expression: >
            !has(object.spec) || (
              object.spec.containers.all(c,
                has(c.securityContext)
                && has(c.securityContext.seLinuxOptions)
                && has(c.securityContext.seLinuxOptions.level)
                && c.securityContext.seLinuxOptions.level != "")
            )
