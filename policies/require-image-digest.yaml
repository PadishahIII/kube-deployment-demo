apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-image-digest
  annotations:
    policies.kyverno.io/title: Require digest-pinned images
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Every image reference must be digest-pinned (@sha256:), no mutable tags.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
  - name: check-image-digest
    match:
      any:
      - resources:
          kinds: [Pod]
          namespaceSelector:
            matchLabels:
              tenancy.io/tenant: "true"
    validate:
      message: "Every container image must be digest-pinned (@sha256:); mutable tags are not allowed."
      cel:
        expressions:
        - expression: >
            !has(object.spec) || (
              object.spec.containers.all(c, c.image.contains("@sha256:"))
            )
