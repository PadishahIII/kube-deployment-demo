apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-drop-all-capabilities
  annotations:
    policies.kyverno.io/title: Require dropping ALL capabilities
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Every container must drop ALL Linux capabilities.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
  - name: check-drop-all
    match:
      any:
      - resources:
          kinds: [Pod]
          namespaceSelector:
            matchLabels:
              tenancy.io/tenant: "true"
    validate:
      message: "Every container must set securityContext.capabilities.drop to include ALL."
      cel:
        expressions:
        - expression: >
            !has(object.spec) || (
              object.spec.containers.all(c,
                has(c.securityContext)
                && has(c.securityContext.capabilities)
                && c.securityContext.capabilities.drop.exists(x, x == "ALL"))
            )
