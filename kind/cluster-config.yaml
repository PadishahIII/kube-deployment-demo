# kind/cluster-config.yaml
#
# Create the hardened demo cluster:
#   kind create cluster --name kind --config kind/cluster-config.yaml
#
# What this config does (all of it is the "cluster hardening" story):
#   kube-apiserver:
#     - OIDC via dex (see resources/cluster/dex.yaml). In-cluster HTTP for the
#       demo; a production cluster would use a TLS-terminated issuer URL.
#     - authorization-mode Node,RBAC (RBAC is the only real authorizer).
#   kubelet:
#     - anonymous auth disabled (no unauthenticated kubelet access)
#     - webhook authorization (kubelet defers to the apiserver's RBAC)
#     - read-only port (10255) disabled
#
# NOTE: this must be used to CREATE the cluster (a fresh one). You cannot add
# these args to an already-running cluster without recreating it.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  kubeadmConfigPatches:
  # --- kube-apiserver: OIDC + authorization mode ---
  - |
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        oidc-issuer-url: "http://dex.platform.svc:5556"
        oidc-client-id: "kubernetes"
        oidc-username-claim: "email"
        oidc-groups-claim: "groups"
        oidc-username-prefix: ""
        oidc-groups-prefix: ""
        authorization-mode: "Node,RBAC"
  # --- kubelet: hardening ---
  - |
    kind: KubeletConfiguration
    authentication:
      anonymous:
        enabled: false
      webhook:
        enabled: true
        cacheTTL: 10s
    authorization:
      mode: Webhook
    readOnlyPort: 0
