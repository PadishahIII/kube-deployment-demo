replicaCount: 1
# The single source of truth for the app name (resource names + `app` label).
# Each tenant values file sets it (nameOverride: shop / analytics / ...).
nameOverride: ""

image:
  # Defaults only — a real deploy always provides one of:
  #   - image.fullRef (digest-pinned, preferred; CD stamps it after cosign verify)
  #   - image.repository + image.tag
# Without either, the chart refuses to render (fail-closed).
  repository: ""
  tag: ""
  fullRef: ""
  pullPolicy: IfNotPresent

# Attestation annotations, stamped by the developer (tenant values) and re-stamped
# by CD after `cosign verify` succeeds. Left empty by default so a non-CD deploy is
# DENIED by require-image-attestation.
annotations:
  imageVerified: ""
  imageDigest: ""

serviceAccount:
  automountServiceAccountToken: false

service:
  type: ClusterIP
  port: 8080

containerPort: 8080

# Pod-level security context.
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seLinuxOptions:
    level: s0:c123,c456

# Container-level security context (satisfies the per-container policies).
containerSecurityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  procMount: Default
  capabilities:
    drop:
    - ALL

persistence:
  enabled: true
  size: 1Gi
  accessMode: ReadWriteOnce

networkPolicy:
  enabled: true
  # Ingress allows: [{namespace: <ns>}] — default-deny when empty.
  ingressFrom: []
  # Egress allows: [{namespace: <ns>, app: <app>, port: <n>}] — DNS is always
  # allowed; anything else is denied unless listed here.
  egressTo: []
