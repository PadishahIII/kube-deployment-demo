# shop — tenant-a, :8080. Can call analytics (tenant-b):9090; nothing may call it.
# Image + attestation are developer-owned: fullRef is the digest-pinned ref of the
# image this file describes, and annotations.image* assert its cosign-verified state
# (the deploy step re-attests after cosign verify — a fresh digest here means the
# image was re-signed and re-verified). Replace the placeholder digest with your
# signed image's digest (SETUP_DEMO.md §10).
nameOverride: shop
image:
  repository: docker.io/padishahiii/kube-sec-shop
  tag: "1.0.0"
  fullRef: docker.io/padishahiii/kube-sec-shop@sha256:1111111111111111111111111111111111111111111111111111111111111111
annotations:
  imageVerified: cosign
  imageDigest: sha256:1111111111111111111111111111111111111111111111111111111111111111
service:
  port: 8080
containerPort: 8080
networkPolicy:
  egressTo:
  - namespace: tenant-b
    app: analytics
    port: 9090
  ingressFrom: []
