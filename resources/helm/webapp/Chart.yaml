apiVersion: v2
name: webapp
description: >-
  A hardened web application for a tenant namespace. One chart, two releases
  (shop in tenant-a :8080, analytics in tenant-b :9090). Enforces the full
  Kyverno policy set: non-root, no priv-esc, read-only rootfs, default /proc,
  dropped caps, SELinux options, dedicated SA, no SA-token automount, digest +
  attestation, and default-deny network policies.
type: application
version: 0.1.0
appVersion: "1.0.0"
