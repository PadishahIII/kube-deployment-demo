apiVersion: v1
kind: Pod
metadata:
  name: shop
  namespace: tenant-a
  annotations:
    security.devsecops.io/image-verified: "cosign"
    security.devsecops.io/image-digest: "sha256:1111111111111111111111111111111111111111111111111111111111111111"
  labels:
    app: shop
spec:
  serviceAccountName: shop-sa
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    fsGroup: 1000
  containers:
  - name: shop
    image: docker.io/padishahiii/kube-sec-shop@sha256:1111111111111111111111111111111111111111111111111111111111111111
    ports:
    - containerPort: 8080
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      privileged: false
      procMount: Default
      capabilities:
        drop: [ALL]
      seLinuxOptions:
        level: s0:c123,c456
    volumeMounts:
    - name: logs
      mountPath: /tmp
  volumes:
  - name: logs
    emptyDir: {}
