apiVersion: v1
kind: Pod
metadata:
  name: analytics
  namespace: tenant-b
  annotations:
    security.devsecops.io/image-verified: "cosign"
    security.devsecops.io/image-digest: "sha256:2222222222222222222222222222222222222222222222222222222222222222"
  labels:
    app: analytics
spec:
  serviceAccountName: analytics-sa
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    fsGroup: 1000
  containers:
  - name: analytics
    image: docker.io/padishahiii/kube-sec-analytics@sha256:2222222222222222222222222222222222222222222222222222222222222222
    ports:
    - containerPort: 9090
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      privileged: false
      procMount: Default
      capabilities:
        drop: [ALL]
      seLinuxOptions:
        level: s0:c123,c456
    volumeMounts:
    - name: logs
      mountPath: /tmp
  volumes:
  - name: logs
    emptyDir: {}
