apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-default-proc-mount-test
policies:
- ../../../policies/require-default-proc-mount.yaml
resources:
- pod-compliant.yaml
- pod-violating.yaml
variables: values.yaml
results:
- policy: require-default-proc-mount
  rule: check-proc-mount
  kind: Pod
